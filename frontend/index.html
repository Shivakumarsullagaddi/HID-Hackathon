<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spot-a-Spoof · Kiosk</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="top">
    <h1>Spot-a-Spoof</h1>
    <nav>
      <a class="here" href="/">Kiosk</a><a href="/enrol">Enrol</a><a href="/lab">Spoof lab</a><a href="/metrics">Metrics</a>
    </nav>
    <span id="state-badge"></span>
    <span id="mode-badge"></span>
  </header>
  <main>
    <div id="status-banner" class="banner" hidden></div>
    <div id="locked-banner" class="banner bad" hidden>
      <b>Offline too long. Please see the guard.</b>
      <span id="locked-reason" class="muted"></span>
    </div>
    <div class="row toolbar">
      <label class="inline">Door
        <select id="room"></select>
      </label>
      <label class="inline toggle" title="Demo control: the kiosk stops talking to central, exactly as in a real outage">
        <input type="checkbox" id="simulate"> Simulate central outage
        <span class="sim-tag" id="sim-tag" hidden>SIMULATED</span>
      </label>
      <span id="state-detail" class="muted"></span>
    </div>
    <div class="grid">
      <section>
        <div class="stage">
          <video id="video" playsinline muted></video>
          <div id="oval" class="oval"></div>
          <div id="hint" class="hint">Starting camera…</div>
        </div>
        <div class="row">
          <button id="verify" class="big" disabled>Verify</button>
        </div>
      </section>
      <section>
        <div id="result" class="card result">
          <h2>Result</h2>
          <p class="sub">Look at the camera, line your face up with the oval, and press Verify.</p>
        </div>
        <div id="stepup" class="card" hidden>
          <h2>Extra check</h2>
          <p class="sub" id="stepup-text">Press Start, then blink twice slowly while looking at the camera.</p>
          <label id="pin-row" hidden>PIN (offline mode needs your PIN as well as a blink)
            <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"
                   pattern="\d{4,8}" placeholder="4 to 8 digits">
          </label>
          <div class="row">
            <button id="blink-start">Start check</button>
            <span id="blink-status" class="countdown"></span>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="/static/camera.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
