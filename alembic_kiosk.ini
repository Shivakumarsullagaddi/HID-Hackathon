# Kiosk database migrations (data/kiosk.db).
#   alembic -c alembic_kiosk.ini upgrade head
# The kiosk also runs "upgrade head" itself at startup, after a backup.
# Override the database with:  alembic -c alembic_kiosk.ini -x url=sqlite:///path upgrade head
[alembic]
script_location = migrations/kiosk
